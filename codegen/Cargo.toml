[package]
name = "codegen"
version = "0.1.0"
edition = "2021"

[dependencies]
yargem-common = { path = "../yargem-common" }
clap = { version = "4.6.6", features = ["derive"] }
phf = { version = "0.14.0", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
tera = { version = "2.3.0", features = ["fast", "fast_hash", "glob_fs"] }

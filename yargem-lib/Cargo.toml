[package]
name = "yargem-lib"
version = "0.1.0"
edition = "2021"

[features]
blaarg = [] # no dependencies
debug = []

[dependencies]
bitvec = "1.1.1"
yargem-common = { path = "../yargem-common" }
serde = { version = "1.0.229", features = ["derive"] }
slab = "0.4.12"
phf = { version = "0.14.0", features = ["macros"] }
